---
# Source: mywebapp/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-service
  labels:
    helm.sh/chart: mywebapp-0.1.0
    app.kubernetes.io/name: mywebapp
    app.kubernetes.io/instance: myprod
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: true
---
# Source: mywebapp/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: myprod-mywebapp
  labels:
    helm.sh/chart: mywebapp-0.1.0
    app.kubernetes.io/name: mywebapp
    app.kubernetes.io/instance: myprod
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: mywebapp
    app.kubernetes.io/instance: myprod
---
# Source: mywebapp/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myprod-mywebapp
  labels:
    helm.sh/chart: mywebapp-0.1.0
    app.kubernetes.io/name: mywebapp
    app.kubernetes.io/instance: myprod
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: mywebapp
      app.kubernetes.io/instance: myprod
  template:
    metadata:
      labels:
        helm.sh/chart: mywebapp-0.1.0
        app.kubernetes.io/name: mywebapp
        app.kubernetes.io/instance: myprod
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: nginx-service
      containers:
        - name: mywebapp
          image: "nginx:1.25"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
---
# Source: mywebapp/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "myprod-mywebapp-test-connection"
  labels:
    helm.sh/chart: mywebapp-0.1.0
    app.kubernetes.io/name: mywebapp
    app.kubernetes.io/instance: myprod
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['myprod-mywebapp:80']
  restartPolicy: Never
