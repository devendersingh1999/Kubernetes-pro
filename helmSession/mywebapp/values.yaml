replicaCount: 5

image:
  repository: hashicorp/http-echo
  tag: "0.2.3"
  pullPolicy: IfNotPresent
  args:
  - "-text=Hello from mywebapp"

service:
  type: ClusterIP
  port: 80
  targetPort: 5678

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

env: []
# Example:
# env:
#   - name: ENVIRONMENT
#     value: "production"

ingress:
  enabled: false
  className: "hashi-eg"
  hosts:
  - host: mywebapp.example.com
    paths:
    - path: /
      pathType: Prefix
      backend:
        service:
          name: mywebapp
          port:
            number: 80
  tls: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
