apiVersion: v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 2
  selector:
  matchLables:
    app: mysql-db

  template:
    metadata:
      labels:
        app: mysql-db
    spec:
      containers:
      - name: mydb-container
        image:
          tag: 9.4.0
          repository: bitnami/mysql

        auth:
          rootPassword: myrootpass
          database: mydatabase
          username: root
          password: root

        primary:
          persistence:
            enabled: false
