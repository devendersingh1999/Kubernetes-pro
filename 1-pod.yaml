apiVersion: v1
kind: Pod
metadata:
  name: first-pod
  labels:
    app: sample

spec:
  containers:
  - name: nginx-container
    image: nginx:latest

    ports:
    - containerPort: 80
    resources:
      requests:
        cpu: "200m"
        memory: "128Mi"

      limits:
        cpu: "500m"
        memory: "256Mi"
